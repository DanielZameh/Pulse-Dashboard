<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse Workspace</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <header>
    <div class="branding-text">PULSE<span style="color: #818cf8;">.</span></div>
    <div>
      <button onclick="toggleClockMode()" id="timeToggleButton" class="time-toggle-btn">12H</button>
    </div>
  </header>

  <div class="clock-display-area">
    <div id="clockDisplay" class="digital-clock-face">00:00</div>
    <div id="dateDisplayLabel" class="calendar-date-label">Loading...</div>
  </div>

  <div class="search-container-box">
    <form onsubmit="executeWebSearch(event)">
      <input type="text" id="searchInputField" class="search-text-input" placeholder="Search web or type URL..." autocomplete="off">
    </form>
  </div>

  <div class="widgets-grid-row">
    <div class="widget-card-panel">
      <div class="widget-header-title">Weather</div>
      <div id="temperatureDisplay" class="temperature-value-display">--°C</div>
      <div id="locationDisplay" class="location-name-display">Loading...</div>
    </div>
    <div class="widget-card-panel">
      <div class="widget-header-title">Focus Goal</div>
      <input type="text" id="focusGoalInput" class="search-text-input" style="font-size: 11px; padding: 6px 10px;" placeholder="Main objective?">
    </div>
    <div class="widget-card-panel">
      <div class="widget-header-title">Quote</div>
      <p style="font-size: 11px; font-style: italic; color: #a3a3a3; margin: 0;">"Simplicity is key."</p>
    </div>
  </div>

  <div class="bottom-grid-row">
    <div class="widget-card-panel">
      <div class="widget-header-title">Quick Links</div>
      <div id="linksContainerBox" class="quick-links-container"></div>
    </div>
    <div class="widget-card-panel">
      <div class="widget-header-title">Tasks</div>
      <ul id="taskUnorderedList" class="task-list-element"></ul>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
